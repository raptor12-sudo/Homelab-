# AdGuard Home : DNS filtrant du homelab, déployé dans ~/adguard sur le Pi.
# Ports publiés uniquement sur l'IP locale du Pi : le Pi a une IPv6 publique, AdGuard ne doit pas être joignable depuis Internet.
# ADGUARD_IP change cette adresse hors de la maison, par exemple : ADGUARD_IP=127.0.0.1 docker compose up -d
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79  # version figée : changer volontairement, après lecture des notes de version
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      - "${ADGUARD_IP:-192.168.1.81}:53:53/udp"
      - "${ADGUARD_IP:-192.168.1.81}:53:53/tcp"
      - "${ADGUARD_IP:-192.168.1.81}:8080:80/tcp"    # interface web après installation
